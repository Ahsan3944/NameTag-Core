name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@v4
      - name: Check platform boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*import[[:space:]]+(net\\.minecraft|net\\.fabricmc|org\\.bukkit|io\\.papermc)\\.' core/src api/src common/src; then
            echo "Platform/version imports leaked into core/api/common."
            exit 1
          fi
      - name: Run build with Gradle Wrapper
        run: ./gradlew build --no-daemon

      - name: Verify expected build artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            core/build/libs
            api/build/libs
            common/build/libs
            platform/fabric/build/libs
            platform/paper/build/libs
            versions/fabric-1.21.11/build/libs
            versions/paper-1.21.11/build/libs
          )
          for dir in "${expected[@]}"; do
            if ! compgen -G "$dir/*.jar" > /dev/null; then
              echo "Missing build artifact in $dir"
              exit 1
            fi
          done

      - name: Prepare installable platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/fabric dist/paper

          fabric_jar="$(find platform/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)"
          paper_jar="$(find platform/paper/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)"

          test -n "$fabric_jar"
          test -n "$paper_jar"

          cp "$fabric_jar" "dist/fabric/NameTag-Core-Fabric-1.21.11.jar"
          cp "$paper_jar" "dist/paper/NameTag-Core-Paper-1.21.11.jar"

          unzip -p "$fabric_jar" fabric.mod.json > dist/fabric/fabric.mod.json
          grep -q '"id": "nametag-core"' dist/fabric/fabric.mod.json
          grep -q '"minecraft": "~1.21.11"' dist/fabric/fabric.mod.json

          # Materialize the archive entry list once so validation remains
          # safe under "set -o pipefail".
          unzip -Z1 "$fabric_jar" > /tmp/fabric-entries.txt
          grep -q 'com/ultraop/nametag/fabric/NameTagFabricEntrypoint.class' /tmp/fabric-entries.txt
          grep -q 'com/ultraop/nametag/fabric/v1_21_11/Fabric2111Adapter.class' /tmp/fabric-entries.txt

          # The version adapter is compiled by this Loom project so its Minecraft
          # named references are remapped before distribution. Guard against the
          # exact runtime failure where net.minecraft.text.Text remains in the JAR.
          unzip -p "$fabric_jar" com/ultraop/nametag/fabric/v1_21_11/Fabric2111Adapter.class > /tmp/fabric-adapter.class
          strings /tmp/fabric-adapter.class > /tmp/fabric-adapter-strings.txt
          if grep -q 'net/minecraft/text/Text' /tmp/fabric-adapter-strings.txt; then
            echo "Fabric version adapter still contains named Minecraft references."
            exit 1
          fi
          grep -q 'net/minecraft/class_2561' /tmp/fabric-adapter-strings.txt

          # Loom packages external libraries as nested JARs under
          # META-INF/jars. Verify the nested SnakeYAML JAR and the
          # runtime class it contains.
          snakeyaml_nested="$(awk 'index($0, "META-INF/jars/") == 1 && tolower($0) ~ /snakeyaml.*\.jar$/ { print; exit }' /tmp/fabric-entries.txt)"
          test -n "$snakeyaml_nested"
          unzip -p "$fabric_jar" "$snakeyaml_nested" > /tmp/snakeyaml.jar
          jar tf /tmp/snakeyaml.jar > /tmp/snakeyaml-contents.txt
          grep -q 'org/yaml/snakeyaml/constructor/BaseConstructor.class' /tmp/snakeyaml-contents.txt

          unzip -p "$paper_jar" plugin.yml > dist/paper/plugin.yml

      - name: Upload installable Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: nametag-core-fabric-1.21.11
          path: dist/fabric/NameTag-Core-Fabric-1.21.11.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: nametag-core-paper-1.21.11
          path: dist/paper/NameTag-Core-Paper-1.21.11.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nametag-core-build-artifacts
          path: |
            core/build/libs/*.jar
            api/build/libs/*.jar
            common/build/libs/*.jar
            platform/fabric/build/libs/*.jar
            platform/paper/build/libs/*.jar
            versions/fabric-1.21.11/build/libs/*.jar
            versions/paper-1.21.11/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
