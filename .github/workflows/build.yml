name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@v4
      - name: Run build with Gradle Wrapper
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nametag-core-build-artifacts
          path: |
            core/build/libs/*.jar
            api/build/libs/*.jar
            common/build/libs/*.jar
            platform/fabric/build/libs/*.jar
            platform/paper/build/libs/*.jar
            versions/fabric-1.21.11/build/libs/*.jar
            versions/paper-1.21.11/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
