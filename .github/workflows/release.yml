name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle Wrapper validation
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build --no-daemon

      - name: Prepare direct JAR assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          fabric_jar="$(find platform/fabric/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)"
          paper_jar="$(find platform/paper/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)"

          test -n "$fabric_jar"
          test -n "$paper_jar"

          cp "$fabric_jar" "release/NameTag-Core-Fabric-1.21.11.jar"
          cp "$paper_jar" "release/NameTag-Core-Paper-1.21.11.jar"

          unzip -p "$fabric_jar" fabric.mod.json > release/fabric.mod.json
          grep -q '"id": "nametag-core"' release/fabric.mod.json
          grep -q '"minecraft": "~1.21.11"' release/fabric.mod.json
          unzip -l "$fabric_jar" | grep -q "com/ultraop/nametag/fabric/NameTagFabricEntrypoint.class"

          unzip -p "$paper_jar" plugin.yml > release/plugin.yml

          (
            cd release
            sha256sum NameTag-Core-Fabric-1.21.11.jar NameTag-Core-Paper-1.21.11.jar > SHA256SUMS.txt
          )

          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub release with direct JAR assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "NameTag-Core ${{ inputs.version }}" \
            --generate-notes \
            release/NameTag-Core-Fabric-1.21.11.jar \
            release/NameTag-Core-Paper-1.21.11.jar \
            release/SHA256SUMS.txt
