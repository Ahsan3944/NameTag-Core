plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

dependencies {
    minecraft "com.mojang:minecraft:" + minecraft_version
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:3.1.27+4fc5413f3e"
    implementation project(':api')
    implementation project(':common')
    implementation project(path: ':versions:fabric-1.21.11', configuration: 'namedElements')

    // Ship the complete Fabric mod as one installable JAR. These project
    // dependencies are intentionally included because the server only loads
    // the platform JAR from its mods directory. Loom's include configuration
    // is non-transitive, so every internal runtime module is listed explicitly.
    include project(':api')
    include project(':core')
    include project(':common')
    include project(path: ':versions:fabric-1.21.11', configuration: 'namedElements')
    compileOnly "net.luckperms:api:5.5"

    include "org.xerial:sqlite-jdbc:3.53.0.0"
    include "com.mysql:mysql-connector-j:9.7.0"
    include "com.google.protobuf:protobuf-java:4.31.1"
    include "org.mariadb.jdbc:mariadb-java-client:3.5.8"
    include "org.postgresql:postgresql:42.7.10"
    include "org.checkerframework:checker-qual:3.52.0"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "nametag-core-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

sourceSets.named("gametest") {
    compileClasspath += sourceSets.main.compileClasspath
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath
    runtimeClasspath += sourceSets.main.output
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
