plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

dependencies {
    minecraft "com.mojang:minecraft:" + minecraft_version
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:3.1.27+4fc5413f3e"
    implementation project(':api')
    implementation project(':common')
    implementation project(path: ':versions:fabric-1.21.11', configuration: 'namedElements')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "nametag-core-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    add("gametestImplementation", "net.fabricmc.fabric-api:fabric-gametest-api-v1:3.1.27+4fc5413f3e")
}

afterEvaluate {
    configurations.named("gametestCompileClasspath") {
        extendsFrom(configurations.named("minecraftNamedCompile").get())
    }

    configurations.named("gametestRuntimeClasspath") {
        extendsFrom(configurations.named("minecraftNamedRuntime").get())
    }

    // Loom attaches the fully transformed/mapped Minecraft classpath to its
    // main JavaCompile task. Reuse that exact classpath for the generated
    // GameTest compiler instead of reconstructing Loom's internal classpath.
    tasks.named("compileGametestJava", JavaCompile) {
        def mainCompile = tasks.named("compileJava", JavaCompile).get()
        dependsOn(mainCompile)
        classpath = files(
            mainCompile.classpath,
            sourceSets.main.output,
            sourceSets.gametest.compileClasspath
        )

        doFirst {
            logger.lifecycle("GAMETEST_CP=" + classpath.files.collect { it.name }.findAll { it.toLowerCase().contains("minecraft") || it.toLowerCase().contains("fabric") || it.toLowerCase().contains("yarn") }.sort().join("|"))
            logger.lifecycle("LOOM_NAMED_CP=" + configurations.findByName("minecraftNamedCompile")?.files?.collect { it.name }?.join("|"))
            logger.lifecycle("LOOM_COMMON_NAMED_CP=" + configurations.findByName("minecraftCommonNamedCompile")?.files?.collect { it.name }?.join("|"))
            def helperEntry = "net/minecraft/gametest/framework/GameTestHelper.class"
            def helperJars = classpath.files.findAll { it.isFile() && it.name.endsWith(".jar") && zipTree(it).matching { include(helperEntry) }.files }
            logger.lifecycle("GAMETEST_HELPER_JARS=" + helperJars.collect { it.name }.join("|"))
        }
    }
}

sourceSets.named("gametest") {
    compileClasspath += sourceSets.main.compileClasspath
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath
    runtimeClasspath += sourceSets.main.output
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
