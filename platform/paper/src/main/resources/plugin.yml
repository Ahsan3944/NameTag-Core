name: NameTag-Core
version: "${project.version}"
main: com.ultraop.nametag.paper.NameTagPaperPlugin
api-version: '1.21'
author: UltraOP
description: Cross-platform NameTag system for Paper servers.

commands:
  nametag:
    description: NameTag-Core administration commands
    usage: /nametag create <tag> <displayName>
    permission: nametag.edit

permissions:
  nametag.edit:
    description: Allows editing NameTag settings
    default: op
