name: NameTag-Core
version: "${project.version}"
main: com.ultraop.nametag.paper.NameTagPaperPlugin
api-version: '1.21'
author: UltraOP

libraries:
  - org.xerial:sqlite-jdbc:3.53.0.0
  - com.mysql:mysql-connector-j:9.7.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.8
  - org.postgresql:postgresql:42.7.10
description: Cross-platform NameTag system for Paper servers.

commands:
  nametag:
    description: NameTag-Core administration commands
    usage: /nametag <subcommand>

permissions:
  nametag.use:
    description: Allows viewing NameTags
    default: op
  nametag.create:
    description: Allows creating NameTags
    default: op
  nametag.edit:
    description: Allows editing NameTag properties and effects
    default: op
  nametag.delete:
    description: Allows deleting NameTags
    default: op
  nametag.remove:
    description: Allows removing NameTags from players
    default: op
  nametag.reload:
    description: Allows reloading NameTag configuration
    default: op
  nametag.chat:
    description: Allows using NameTags in chat
    default: op
  nametag.admin:
    description: Grants all NameTag administration permissions
    default: op
